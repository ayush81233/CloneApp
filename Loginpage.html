<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieMedia | Login</title>

    <link rel="stylesheet" href="style.css">
    
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>MovieMedia</h1>

        <h2>Welcome Back</h2>

        <p>Login to continue watching your favourite movies.</p>

        <form method="POST" action="#" onsubmit="handleLogin(event)">

            <div class="input-box">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" name="email" placeholder="Email Address" required>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <div class="options">

                <label>
                    <input type="checkbox" name="remember">
                    Remember Me
                </label>

                <a href="#">Forgot Password?</a>

            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="divider">
            OR
        </div>

        <div class="social-login">

            <button type="button" onclick="loginWithGoogle()">
                <i class="fab fa-google"></i>
                Google
            </button>

            <button type="button" onclick="loginWithFacebook()">
                <i class="fab fa-facebook"></i>
                Facebook
            </button>

        </div>

        <p class="signup-link">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

    </div>

</div>

<script>
    function handleLogin(event) {
        event.preventDefault();
        const email = event.target.email.value;
        const password = event.target.password.value;
        if (email && password) {
            alert('Login successful for ' + email);
            // Redirect to home page or dashboard
            window.location.href = 'Home_page.html';
        } else {
            alert('Please fill in all fields');
        }
    }

    function loginWithGoogle() {
        alert('Google login functionality to be implemented');
    }

    function loginWithFacebook() {
        alert('Facebook login functionality to be implemented');
    }
</script>

</body>
</html>
